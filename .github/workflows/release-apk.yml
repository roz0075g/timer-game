name: Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version, for example 1.0.4'
        required: true
        type: string
      version_code:
        description: 'Android versionCode, for example 10004'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/timer-game-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is not configured"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

      - name: Resolve release version
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION_NAME="${TAG_NAME#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          else
            VERSION_NAME="$INPUT_VERSION_NAME"
            VERSION_CODE="$INPUT_VERSION_CODE"
          fi

          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid versionName: $VERSION_NAME"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "Invalid versionCode: $VERSION_CODE"; exit 1; }

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION_NAME ($VERSION_CODE)"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build signed release APK
        run: |
          gradle --no-daemon assembleRelease \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/timer-game-release.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              app/build/outputs/apk/release/timer-game-release.apk \
              --title "Timer Game v$VERSION_NAME" \
              --generate-notes
          else
            echo "workflow_dispatch completed a signed build without creating a release"
          fi

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: timer-game-release-apk-${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/timer-game-release.apk
          if-no-files-found: error
